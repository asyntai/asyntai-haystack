[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asyntai-haystack"
version = "0.1.0"
description = "Haystack components and agent tools for Asyntai, the AI chat agent for websites"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Asyntai", email = "hello@asyntai.com" }]
keywords = ["haystack", "asyntai", "chatbot", "agent", "rag", "website", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "haystack-ai>=2.14.0",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://asyntai.com"
Documentation = "https://asyntai.com/documentation/integrations/haystack/"
Source = "https://github.com/asyntai/asyntai-haystack"

[project.optional-dependencies]
test = ["pytest>=7.0", "requests-mock>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/haystack_integrations"]
